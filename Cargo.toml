[package]
name = "the-last-key-bender"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
lewton = "0.10.2"
midly = { version = "0.5", default-features = false, features = ["std"] }
rfd = "0.18.0"
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
